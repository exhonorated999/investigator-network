<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="840" viewBox="0 0 1600 840" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e18"/>
      <stop offset="0.55" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#080b14"/>
    </linearGradient>
    <radialGradient id="glowBand" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#1d3b8f" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bandFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12244f"/>
      <stop offset="1" stop-color="#0c1730"/>
    </linearGradient>
    <linearGradient id="sub" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b7dff"/>
      <stop offset="1" stop-color="#7fb0ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="bandGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1600" height="840" fill="url(#bg)"/>

  <!-- faint constellation dots -->
  <g fill="#4f6aa0" opacity="0.5">
    <circle cx="120" cy="120" r="2"/><circle cx="300" cy="70" r="1.5"/><circle cx="520" cy="150" r="1.5"/>
    <circle cx="880" cy="90" r="2"/><circle cx="1120" cy="140" r="1.5"/><circle cx="1360" cy="80" r="2"/>
    <circle cx="1480" cy="200" r="1.5"/><circle cx="90" cy="360" r="1.5"/><circle cx="1520" cy="420" r="2"/>
    <circle cx="160" cy="620" r="1.5"/><circle cx="420" cy="720" r="2"/><circle cx="760" cy="760" r="1.5"/>
    <circle cx="1080" cy="700" r="1.5"/><circle cx="1380" cy="660" r="2"/><circle cx="1240" cy="560" r="1.5"/>
  </g>
  <g stroke="#3a5590" stroke-width="1" opacity="0.22">
    <line x1="120" y1="120" x2="300" y2="70"/>
    <line x1="880" y1="90" x2="1120" y2="140"/>
    <line x1="1360" y1="80" x2="1480" y2="200"/>
    <line x1="420" y1="720" x2="760" y2="760"/>
    <line x1="1080" y1="700" x2="1380" y2="660"/>
  </g>

  <!-- top-left product mark -->
  <g transform="translate(72,70)">
    <text x="0" y="34" font-size="42" font-weight="800" letter-spacing="1" fill="#3b7dff">DP<tspan fill="#eaf1ff">10</tspan></text>
    <text x="2" y="58" font-size="15" font-weight="700" letter-spacing="4" fill="#8fa6cf">ADVANCED</text>
  </g>

  <!-- tagline -->
  <text x="800" y="235" text-anchor="middle" font-size="24" font-weight="700" letter-spacing="4" fill="#9db4dc">ADVANCED MOBILE FORENSICS  &#183;  SOUTH AFRICAN POLICE SERVICE</text>

  <!-- glowing band -->
  <rect x="150" y="285" width="1300" height="330" rx="6" fill="url(#glowBand)" filter="url(#bandGlow)"/>
  <rect x="170" y="300" width="1260" height="300" rx="4" fill="url(#bandFill)" stroke="#3b7dff" stroke-opacity="0.7" stroke-width="2"/>

  <!-- wordmark -->
  <g text-anchor="middle">
    <text x="800" y="470" font-size="150" font-weight="800" letter-spacing="6" fill="#3b7dff" opacity="0.55" filter="url(#soft)">DATAPILOT</text>
    <text x="800" y="470" font-size="150" font-weight="800" letter-spacing="6" fill="#f4f8ff">DATAPILOT</text>
    <text x="800" y="560" font-size="58" font-weight="800" letter-spacing="14" fill="url(#sub)">DP10 ADVANCED</text>
  </g>

  <!-- program strip -->
  <g text-anchor="middle" fill="#dbe6ff">
    <line x1="360" y1="675" x2="520" y2="675" stroke="#3b7dff" stroke-width="2"/>
    <text x="800" y="688" font-size="34" font-weight="800" letter-spacing="8">SAPS  TRAINING  PROGRAM</text>
    <line x1="1080" y1="675" x2="1240" y2="675" stroke="#3b7dff" stroke-width="2"/>
  </g>

  <!-- bottom bar -->
  <line x1="0" y1="762" x2="1600" y2="762" stroke="#3b7dff" stroke-opacity="0.65" stroke-width="3"/>
  <rect x="0" y="765" width="1600" height="75" fill="#0a0f1c"/>
  <text x="72" y="798" font-size="16" font-weight="700" letter-spacing="3" fill="#5f7dc0">COURSE</text>
  <text x="72" y="822" font-size="24" font-weight="800" fill="#eaf1ff">Advanced Datapilot 10 for SAPS</text>
  <text x="1528" y="798" text-anchor="end" font-size="16" font-weight="700" letter-spacing="3" fill="#5f7dc0">WEB</text>
  <text x="1528" y="822" text-anchor="end" font-size="24" font-weight="800" fill="#eaf1ff">datapilot.com</text>
</svg>
